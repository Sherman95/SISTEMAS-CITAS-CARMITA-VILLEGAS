<div class="welcome-page">
  <main class="welcome-frame" aria-labelledby="welcome-title">
    <img class="welcome-photo" [src]="visuals.welcomeHero" alt="Peinado elegante en tonos cálidos">
    <div class="photo-veil" aria-hidden="true"></div>

    <header class="welcome-brand">
      <span class="brand-emblem" aria-hidden="true"><img [src]="visuals.brandLogo" alt=""></span>
      <span class="brand-words">
        <strong>Carmita<br>Villegas</strong>
        <small>Estilistas</small>
      </span>
    </header>

    <section class="welcome-copy">
      <span class="eyebrow">Belleza · cuidado · estilo</span>
      <h1 id="welcome-title">Tu belleza,<br>nuestra pasión</h1>
      <p>Reserva tus citas de forma rápida y sencilla, en el momento que más te convenga.</p>
    </section>

    <ul class="welcome-benefits" aria-label="Ventajas de reservar con SIDRO">
      <li>
        <span class="benefit-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M8 4c1.4 2.5 1.4 5 0 7.5M16 4c-1.4 2.5-1.4 5 0 7.5M6 20l12-8M18 20 6 12"/><circle cx="7" cy="18" r="2"/><circle cx="17" cy="18" r="2"/></svg></span>
        <span>Servicios profesionales</span>
      </li>
      <li>
        <span class="benefit-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 7v5l3 2"/></svg></span>
        <span>Horarios actualizados</span>
      </li>
      <li>
        <span class="benefit-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M7 11.5 10.2 15 17 8"/><path d="M12 3.5 19 7v5c0 4.4-3 7.1-7 8.5C8 19.1 5 16.4 5 12V7l7-3.5Z"/></svg></span>
        <span>Seguimiento de solicitudes</span>
      </li>
    </ul>

    <div class="welcome-dots" aria-hidden="true"><span class="active"></span><span></span><span></span></div>

    <div class="welcome-actions">
      <a class="primary-action" routerLink="/register">
        Crear mi cuenta
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </a>
      <a class="secondary-action" routerLink="/login">Iniciar sesión</a>
    </div>

    <svg class="botanical-line" viewBox="0 0 180 150" aria-hidden="true">
      <path d="M8 146c34-37 55-76 61-137M43 105c-18-6-26-18-28-32 16 4 26 14 28 32ZM57 72c18-8 27-20 27-36-17 5-26 17-27 36ZM32 128c-16-1-26-9-31-20 15 0 26 7 31 20ZM69 28c13-6 19-14 20-25-12 3-19 12-20 25Z"/>
    </svg>
  </main>
</div>
